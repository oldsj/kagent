syntax = "proto3";

package kagent.runtime.v1;

import "a2a.proto";
import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1/common.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/runtime/v1;runtimev1";

// TaskStoreService is the private persistence API for agent runtimes. Every call
// requires workload authority for the requested session. Public user and share
// credentials do not grant access to this service.
service TaskStoreService {
  // CreateTask persists a new SDK task. Retrying the same task and payload
  // returns its original version; a different creation with that ID conflicts.
  rpc CreateTask(TaskStoreServiceCreateTaskRequest) returns (TaskStoreServiceCreateTaskResponse);
  rpc GetTask(TaskStoreServiceGetTaskRequest) returns (TaskStoreServiceGetTaskResponse);
  rpc UpdateTask(TaskStoreServiceUpdateTaskRequest) returns (TaskStoreServiceUpdateTaskResponse);
  rpc ListTasks(TaskStoreServiceListTasksRequest) returns (TaskStoreServiceListTasksResponse);
  // SettleTask acknowledges that native execution and SDK cleanup have stopped
  // at this saved version and publishes its task state and history atomically.
  // Runtime pause/suspend and checkpoint snapshot readiness are independent.
  rpc SettleTask(TaskStoreServiceSettleTaskRequest) returns (TaskStoreServiceSettleTaskResponse);
  // GetWorkspace returns the Git checkout the Session asked for, or an empty
  // response when it asked for none. The runtime calls it before the first turn.
  rpc GetWorkspace(TaskStoreServiceGetWorkspaceRequest) returns (TaskStoreServiceGetWorkspaceResponse);
  // CompleteWorkspacePreparation reports the result of the assignment returned
  // by GetWorkspace. Only the originally assigned bytes are accepted; repeating
  // a completed report is a no-op.
  rpc CompleteWorkspacePreparation(TaskStoreServiceCompleteWorkspacePreparationRequest) returns (TaskStoreServiceCompleteWorkspacePreparationResponse);
  // ReportActivity tells the control plane whether anything uses the Session
  // runtime outside A2A tasks, such as an attached client or background work.
  // An active report holds idle suspension until its lease ends; the runtime
  // renews it every renew_after. An idle report, or a lapsed lease, lets the
  // control plane suspend the runtime after sessions.quiescenceDelay. A report
  // also extends the Session's idle-expiration clock. Reports are idempotent.
  rpc ReportActivity(TaskStoreServiceReportActivityRequest) returns (TaskStoreServiceReportActivityResponse);
}

message StoredTask {
  lf.a2a.v1.Task task = 1;
  // Opaque task storage version, scoped to its session. Reload after restoring
  // a fork, which receives new public context and task IDs.
  int64 version = 2;
}

message TaskStoreServiceCreateTaskRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  lf.a2a.v1.Task task = 2 [(buf.validate.field).required = true];
  // Gateway attempt fence, consumed by the first active save before native work.
  optional string dispatch_id = 3 [(buf.validate.field).string.uuid = true];
  option (buf.validate.message).cel = {
    id: "task_store.create_identity"
    message: "task and context IDs are required"
    expression: "this.task.id != '' && this.task.context_id != ''"
  };
}

message TaskStoreServiceCreateTaskResponse {
  int64 version = 1;
}

message TaskStoreServiceGetTaskRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.min_len = 1];
}

message TaskStoreServiceGetTaskResponse {
  StoredTask stored = 1;
}

message TaskStoreServiceUpdateTaskRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  lf.a2a.v1.Task task = 2 [(buf.validate.field).required = true];
  int64 expected_version = 3 [(buf.validate.field).int64.gt = 0];
  // Go's SDK supplies the triggering event. Snapshot-only SDKs omit it; the
  // task then describes the complete update. History is archived separately.
  lf.a2a.v1.StreamResponse event = 4;
  optional string dispatch_id = 5 [(buf.validate.field).string.uuid = true];
  option (buf.validate.message).cel = {
    id: "task_store.task_identity"
    message: "task and context IDs are required"
    expression: "this.task.id != '' && this.task.context_id != ''"
  };
}

message TaskStoreServiceUpdateTaskResponse {
  // Retrying the same expected version and payload returns the original
  // committed version, including after subsequent updates have committed.
  int64 version = 1;
}

message TaskStoreServiceListTasksRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  lf.a2a.v1.ListTasksRequest request = 2 [(buf.validate.field).required = true];
}

message TaskStoreServiceListTasksResponse {
  lf.a2a.v1.ListTasksResponse result = 1;
}

message TaskStoreServiceSettleTaskRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  string task_id = 2 [(buf.validate.field).string.min_len = 1];
  int64 version = 3 [(buf.validate.field).int64.gt = 0];
}

message TaskStoreServiceSettleTaskResponse {}

message TaskStoreServiceGetWorkspaceRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
}

message TaskStoreServiceGetWorkspaceResponse {
  // Unset when the Session has no workspace.
  kagent.api.v1.Workspace workspace = 1;
  // True when turns wait for a confirmed workspace preparation.
  bool preparation_required = 2;
  // True once the preparation is confirmed and turns may run.
  bool preparation_ready = 3;
  // The issued assignment, set until its result is committed. Reading it
  // records the issue; a later read returns the same assignment.
  WorkspacePreparation preparation = 4;
  // True for a fork created with a fresh conversation: before its first turn the
  // runtime discards native conversation state restored from the checkpoint.
  bool fresh_conversation = 5;
}

// WorkspacePreparation is one assigned preparation action for this runtime.
message WorkspacePreparation {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  string context_id = 2 [(buf.validate.field).string.uuid = true];
  string create_request_id = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string action_id = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string request_digest = 5 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
  string execution_id = 6 [(buf.validate.field).string.uuid = true];
  string challenge_id = 7 [(buf.validate.field).string.uuid = true];
  // 0 for the original effect; a positive sequence only observes it.
  uint64 sequence = 8 [(buf.validate.field).uint64.lte = 65535];
  string generation_id = 9 [(buf.validate.field).string.uuid = true];
  string atespace = 10 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string actor_name = 11 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string actor_uid = 12 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string prepared_revision = 13 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  kagent.api.v1.Workspace workspace = 14 [(buf.validate.field).required = true];
  string development_image = 15 [(buf.validate.field).string = {min_len: 1, max_len: 512}];
  string platform = 16 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string policy_identity = 17 [(buf.validate.field).string = {min_len: 1, max_len: 256}];
  string payload_image = 18 [(buf.validate.field).string = {min_len: 1, max_len: 512}];
  string provider = 19 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  uint32 schema = 20;
  string cli_version = 21 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string profile = 22 [(buf.validate.field).string = {in: ["supervisor", "child", "agent"]}];
  string setup_digest = 23 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
  // Digests of the revision's bootstrap config_json and its mcp_servers.
  string config_digest = 24 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
  string mcp_digest = 25 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
}

message TaskStoreServiceCompleteWorkspacePreparationRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  WorkspacePreparation assignment = 2 [(buf.validate.field).required = true];
  string head = 3 [(buf.validate.field).string = {max_len: 40, pattern: "^(?:[a-f0-9]{40})?$"}];
  string branch = 4 [(buf.validate.field).string.max_len = 256];
  string transport_digest = 5 [(buf.validate.field).string = {max_len: 64, pattern: "^(?:[a-f0-9]{64})?$"}];
  string native_hook = 6 [(buf.validate.field).string = {in: ["", "append_system_prompt", "developer_instruction"]}];
  google.protobuf.Timestamp observed_at = 7 [(buf.validate.field).required = true];
  // False reports a definite failure.
  bool confirmed = 8;
}

message TaskStoreServiceCompleteWorkspacePreparationResponse {}

message TaskStoreServiceReportActivityRequest {
  string session_id = 1 [(buf.validate.field).string.uuid = true];
  // True while a client, turn, or background work uses the runtime.
  bool active = 2;
}

message TaskStoreServiceReportActivityResponse {
  // How long an active report holds idle suspension.
  google.protobuf.Duration lease = 1;
  // When an active runtime should report again to keep its lease.
  google.protobuf.Duration renew_after = 2;
}

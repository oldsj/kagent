name: Mainloop Fork Fixture CI

on:
  pull_request:
    branches: [mainloop-substrate-1-0]
  push:
    branches: [mainloop-substrate-1-0]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fixture-check:
    name: Go build and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: go
    env:
      GOFLAGS: -p=2
      GOMAXPROCS: "2"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KUBECONFIG: /dev/null
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Record tested source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          checkout_sha=$(git rev-parse --verify HEAD)
          test "$checkout_sha" = "$SOURCE_SHA"
          printf 'Event: %s\nRef: %s\nSelected source SHA: %s\nCheckout SHA: %s\nEvent SHA: %s\nPR head SHA: %s\n' \
            "$EVENT_NAME" "$SOURCE_REF" "$SOURCE_SHA" "$checkout_sha" "$EVENT_SHA" "$PR_HEAD_SHA" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      # The base branch carries upstream plus fork CI only. Each fork feature
      # adds its own packages to these steps in the pull request that ports it.
      - name: Record bounded offline scope
        run: |
          printf '%s\n' \
            'Runtime tests use isolated testcontainers PostgreSQL and fake Actor/gateway/native effects.' \
            'Catalog tests run against envtest (a local kube-apiserver and etcd), not a cluster.' \
            'Deferred: TestPinnedCodexAcceptsGeneratedConfiguration launches the real Codex CLI/app-server.' \
            'No provider credentials, native agents, cluster operations, image publication or rollout.' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build everything
        run: go build ./...
      - name: Test runtime and policy fixtures
        run: go test -count=1 ./adk/pkg/taskstore ./core/internal/egress ./core/internal/substrate ./core/internal/service/taskstore
      # TestSandboxTemplateCatalog and TestEgressPolicyCatalog in grpcserver
      # start envtest, which needs these binaries.
      - name: Install envtest binaries
        run: echo "KUBEBUILDER_ASSETS=$(make -s envtest-path | tail -n1)" >> "$GITHUB_ENV"
      - name: Test PostgreSQL lifecycle, callbacks and control authentication
        # No -short: migration Up/Down and inline SQL must run.
        run: >-
          go test -race -count=1
          ./core/internal/database ./core/pkg/migrations
          ./core/internal/service/session ./core/internal/service/checkpoint
          ./core/internal/grpcserver ./core/internal/httpserver/auth ./core/pkg/auth
      - name: Test subscription credential refresh and compilation
        run: >-
          go test -count=1
          ./core/internal/controller/chatgptrefresh ./core/internal/translator/...
          ./core/internal/service/model ./core/pkg/config
      - name: Test fake native consumers
        run: >-
          go test -count=1 -skip '^TestPinnedCodexAcceptsGeneratedConfiguration$'
          ./harness/claude/... ./harness/codex/... ./harness/runtime/...

  helm-unit-tests:
    name: Helm chart unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: v0.0.1-test
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.0
      - name: Install unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest
      - name: Chart init
        run: make helm-version
      - name: Run helm unit tests
        run: helm unittest helm/kagent

  controller-dev-entrypoint:
    name: controller-dev-entrypoint.sh rebuild-on-change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Run rebuild-on-change smoke test
        # Exercises the dev image's entrypoint against a throwaway Go
        # package (not the real controller, so no Docker/database/kv needed)
        # to prove it builds, starts, and rebuilds+restarts on a source edit.
        run: sh go/scripts/controller-dev-entrypoint_test.sh

  controller-dev-image:
    name: Build and smoke-test kagent-controller-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build controller dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: go
          file: go/Dockerfile.dev
          load: true
          tags: kagent-controller-dev:ci
          build-args: |
            BUILD_PACKAGE=./core/cmd/controller
          # No GHA cache: the image bakes a ~1.3 GB Go module and build cache, and exporting
          # it cost more than rebuilding.
      - name: Smoke-test that the entrypoint builds and starts the controller
        # The controller exits without a config file; the entrypoint logging a
        # started pid proves the baked source built and the binary launched.
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm kagent-controller-dev:ci --config=/etc/kagent/controller.yaml)"
          trap 'docker logs "$container_id" || true; docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if docker logs "$container_id" 2>&1 | grep -q 'controller started pid='; then
              echo "controller-dev-entrypoint.sh built and started the controller binary"
              exit 0
            fi
            sleep 2
          done
          echo '::error::controller-dev-entrypoint.sh never reported a started controller'
          exit 1

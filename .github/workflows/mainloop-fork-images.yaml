name: Publish Mainloop fork images

on:
  push:
    branches: [mainloop-substrate-0-4]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.image }} (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kagent-controller
            file: go/Dockerfile
            build-args: BUILD_PACKAGE=core/cmd/controller/main.go
          - image: kagent-controller-dev
            file: go/Dockerfile.dev
            build-args: BUILD_PACKAGE=core/cmd/controller/main.go
          - image: kagent-claude-harness
            file: go/harness/claude/Dockerfile
            build-args: ''
          - image: kagent-codex-harness
            file: go/harness/codex/Dockerfile
            build-args: ''
          - image: kagent-claude-runtime
            file: go/harness/runtime/payload/Dockerfile
            build-args: PROVIDER=claude
          - image: kagent-codex-runtime
            file: go/harness/runtime/payload/Dockerfile
            build-args: PROVIDER=codex
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Compute image version
        id: version
        shell: bash
        run: echo "version=0.0.0-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: go
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/oldsj/${{ matrix.image }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            DOCKER_REPO=kagent-dev/kagent
            DOCKER_REGISTRY=ghcr.io/oldsj
            BASE_IMAGE_REGISTRY=cgr.dev
            TOOLS_GO_VERSION=1.27.0
            TOOLS_UV_VERSION=0.10.4
            TOOLS_PYTHON_VERSION=3.13
            TOOLS_NODE_VERSION=24
            LDFLAGS=-X github.com/kagent-dev/kagent/go/core/internal/version.Version=${{ steps.version.outputs.version }}
            ${{ matrix.build-args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=publish-${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image }}-arm64

      - name: Record published digest
        shell: bash
        env:
          IMAGE: ghcr.io/oldsj/${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            printf '### %s (linux/arm64)\n\n' "$IMAGE"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Tag: `%s:%s`\n\n' "$IMAGE" "$VERSION"
            printf 'Infra pin: `%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'Update deployment pins through a separately reviewed infra PR.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-charts:
    name: Publish Helm charts
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Compute chart version
        id: version
        shell: bash
        run: echo "version=0.0.0-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.0

      - name: Point default controller image at this build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          sed -i "/repository: kagent-dev\/kagent\/controller/{s#kagent-dev/kagent/controller#oldsj/kagent-controller#; n; s#tag: \"\"#tag: \"$VERSION\"#}" helm/kagent/values.yaml
          # Fail loudly rather than silently if values.yaml no longer matches this pattern.
          [ "$(grep -c 'repository: oldsj/kagent-controller' helm/kagent/values.yaml)" = "1" ]
          [ "$(grep -c "tag: \"$VERSION\"" helm/kagent/values.yaml)" = "1" ]

      - name: Package charts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make helm-version

      - name: Lint and render charts
        shell: bash
        run: |
          set -euo pipefail
          helm lint helm/kagent-crds
          helm lint helm/kagent
          helm template kagent-crds helm/kagent-crds --namespace kagent > /dev/null
          helm template kagent helm/kagent --namespace kagent > /dev/null

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHART_REPO: oci://ghcr.io/oldsj/charts
        run: |
          set -euo pipefail

          # helm package output is not byte-reproducible (file mtimes from the
          # checkout get baked into the tarball), so compare extracted file
          # contents rather than the archive's own sha256. Subchart archives get
          # the same treatment, and Chart.lock's generated: timestamp (when
          # `helm dependency build` ran) is dropped, since both change on every
          # rebuild of the same commit.
          chart_contents_digest() {
            local archive="$1" extract_dir nested
            extract_dir="$(mktemp -d)"
            tar -xzf "$archive" -C "$extract_dir"
            while IFS= read -r -d '' nested; do
              mkdir -p "${nested}.d"
              tar -xzf "$nested" -C "${nested}.d"
              rm "$nested"
            done < <(find "$extract_dir" -name '*.tgz' -print0)
            find "$extract_dir" -name Chart.lock -exec sed -i '/^generated:/d' {} +
            find "$extract_dir" -type f -exec sha256sum {} + \
              | sed "s#${extract_dir}/##" \
              | sort -k2 \
              | sha256sum | cut -d' ' -f1
          }

          for chart in kagent-crds kagent; do
            tgz="dist/${chart}-${VERSION}.tgz"
            test -s "$tgz"
            local_digest="$(chart_contents_digest "$tgz")"

            pull_dir="$(mktemp -d)"
            if pull_output="$(helm pull "${CHART_REPO}/${chart}" --version "$VERSION" -d "$pull_dir" 2>&1)"; then
              existing_tgz="${pull_dir}/${chart}-${VERSION}.tgz"
              existing_digest="$(chart_contents_digest "$existing_tgz")"
              if [ "$existing_digest" = "$local_digest" ]; then
                printf '### %s:%s (unchanged)\n\nAlready published with matching content: `sha256:%s`\n\n' "$chart" "$VERSION" "$local_digest" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              printf '::error::%s/%s:%s already exists with different content (published content sha256:%s, this build content sha256:%s); refusing to overwrite\n' "$CHART_REPO" "$chart" "$VERSION" "$existing_digest" "$local_digest"
              exit 1
            elif ! printf '%s' "$pull_output" | grep -qi 'not found'; then
              printf '%s\n' "$pull_output"
              printf '::error::could not check for an existing %s:%s chart (helm pull failed); a 403/denied error usually means the ghcr.io package charts/%s needs Actions write access granted for oldsj/kagent\n' "$chart" "$VERSION" "$chart"
              exit 1
            fi

            if ! push_output="$(helm push "$tgz" "$CHART_REPO" 2>&1)"; then
              printf '%s\n' "$push_output"
              printf '::error::helm push failed for %s:%s; a 403/denied error usually means the ghcr.io package charts/%s needs Actions write access granted for oldsj/kagent\n' "$chart" "$VERSION" "$chart"
              exit 1
            fi
            printf '%s\n' "$push_output"
            digest="$(printf '%s' "$push_output" | sed -n 's/^Digest: *//p')"
            test -n "$digest"
            {
              printf '### %s/%s:%s\n\n' "$CHART_REPO" "$chart" "$VERSION"
              printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
              printf 'Infra pin: `%s/%s@%s`\n\n' "$CHART_REPO" "$chart" "$digest"
              printf 'Update deployment pins through a separately reviewed infra PR.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done

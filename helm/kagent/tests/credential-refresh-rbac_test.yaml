suite: test credential refresh rbac
templates:
  - rbac/credential-refresh-role.yaml
tests:
  - it: renders nothing while credential refresh is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: grants the refresh permissions cluster-wide when no namespaces are set
    set:
      config.credentialRefresh.chatgptImage: ghcr.io/example/codex-harness:1
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: [batch]
            resources: [jobs]
            verbs: [get, list, create, delete]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, update]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: [rbac.authorization.k8s.io]
            resources: [roles, rolebindings]
            verbs: [get, create]
        documentIndex: 0
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-controller
        documentIndex: 1

  - it: scopes the refresh permissions to the configured namespaces
    set:
      config.credentialRefresh.chatgptImage: ghcr.io/example/codex-harness:1
      rbac.namespaces: [NAMESPACE, tenant]
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Role
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: tenant
        documentIndex: 2

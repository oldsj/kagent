{{- /*
Permissions for scheduled ChatGPT credential refresh Jobs. Rendered only when
config.credentialRefresh.chatgptImage enables them. The controller creates, per
refreshed Secret, a ServiceAccount, a Role and RoleBinding limited to that
Secret, a NetworkPolicy and a Job; it holds Secret get/update itself because
Kubernetes only lets it grant permissions it has.
*/ -}}
{{- define "kagent.credentialRefresh.rules" -}}
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - update
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - create
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - create
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - create
  - delete
{{- end -}}
{{- if dig "credentialRefresh" "chatgptImage" "" .Values.config }}
{{- include "kagent.rbac.validate" . -}}
{{- $rbacNamespaces := include "kagent.rbacNamespaces" . | fromJsonArray }}
{{- if $rbacNamespaces }}
{{- range $namespace := $rbacNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kagent.fullname" $ }}-credential-refresh-role
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent.labels" $ | nindent 4 }}
rules:
  {{- include "kagent.credentialRefresh.rules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kagent.fullname" $ }}-credential-refresh-rolebinding
  namespace: {{ $namespace }}
  labels:
    {{- include "kagent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kagent.fullname" $ }}-credential-refresh-role
subjects:
- kind: ServiceAccount
  name: {{ include "kagent.controller.serviceAccountName" $ | quote }}
  namespace: {{ include "kagent.namespace" $ }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kagent.fullname" . }}-credential-refresh-role
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
rules:
  {{- include "kagent.credentialRefresh.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kagent.fullname" . }}-credential-refresh-rolebinding
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kagent.fullname" . }}-credential-refresh-role
subjects:
- kind: ServiceAccount
  name: {{ include "kagent.controller.serviceAccountName" . | quote }}
  namespace: {{ include "kagent.namespace" . }}
{{- end }}
{{- end }}

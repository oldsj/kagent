# Ephemeral generation Secrets are application resources, never GitOps inventory.
# Provider label/namespace containment is a separate installation requirement.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kagent.fullname" . }}-runtime-credentials
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kagent.fullname" . }}-runtime-credentials
  namespace: {{ include "kagent.namespace" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kagent.fullname" . }}-runtime-credentials
subjects:
- kind: ServiceAccount
  name: {{ include "kagent.controller.serviceAccountName" . | quote }}
  namespace: {{ include "kagent.namespace" . }}
